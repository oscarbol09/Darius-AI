[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "darius-ai"
version = "7.0.0"
description = "Asistente de inteligencia artificial nativo para Windows con control por voz y automatización"
authors = [
    { name = "Oscarbol09", email = "oscarbol09@users.noreply.github.com" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/oscarbol09/Darius-AI"
Repository = "https://github.com/oscarbol09/Darius-AI"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
"tests/*" = ["S101"]
"windows_commands.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", ".venv/*", "antenv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
