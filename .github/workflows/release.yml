name: Release — Darius AI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag / Versión (ej. v8.5.0)'
        required: true
        default: 'v8.5.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # GATE 1: Escaneo de Secretos (Gitleaks)
  # =========================================================================
  security-secrets:
    name: Escaneo de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout completo del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # GATE 2: Pruebas, Tipado, Linting y Auditoría de Dependencias
  # =========================================================================
  verify:
    name: Verificación (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validar linting con Ruff
        run: ruff check --output-format=github .

      - name: Validar formato con Ruff
        run: ruff format --check .

      - name: Validar tipado estático con Mypy
        run: mypy src/

      - name: Auditoría de vulnerabilidades en dependencias (pip-audit)
        run: pip-audit --desc on -r requirements.txt

      - name: Ejecutar suite de pruebas unitarias con cobertura
        run: pytest tests/ -v --cov=src --cov-report=term-missing -m "not live"

  # =========================================================================
  # GATE 3: Compilación Nativa Standalone con Nuitka e Instalador Inno Setup
  # =========================================================================
  build-and-release:
    name: Compilación .EXE y Publicación de Release
    needs: [verify, security-secrets]
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolver tag y versión de release
        id: meta
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}".Trim()
          } else {
            $tag = "${{ github.ref_name }}".Trim()
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag de release inválido: '$tag'. Se requiere formato semántico (ej. v8.5.0)."
          }
          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag resuelto: $tag (versión: $version)"

      - name: Configurar Compilador Nativo MSVC C++ (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Optimizar Memoria Virtual de Windows
        run: |
          Set-CimInstance -Query "Select * from Win32_PageFileSetting" -Property @{InitialSize = 8192; MaximumSize = 16384} -ErrorAction SilentlyContinue

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache de Compilación Nuitka
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Instalar dependencias de ejecución y compilación
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "nuitka>=2.4.0" zstandard ordered-set pillow

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress

      - name: Compilar binario nativo standalone con Nuitka
        env:
          DARIUS_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          GITHUB_REF_NAME: ${{ steps.meta.outputs.tag }}
        run: python build_nuitka.py

      - name: Compilar Instalador de Windows con Inno Setup
        run: |
          mkdir dist-installer -Force
          $TAG = "${{ steps.meta.outputs.tag }}"
          $RAW_VERSION = "${{ steps.meta.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$RAW_VERSION" "/DMyOutputBaseFilename=DariusAI-Setup-$TAG" installer.iss

      - name: Generar paquete portable .ZIP
        run: |
          $TAG = "${{ steps.meta.outputs.tag }}"
          Compress-Archive -Path dist\main.dist\* -DestinationPath "dist-installer\DariusAI-$TAG-windows-x64-portable.zip" -Force

      - name: Generar Ledger Criptográfico SHA-256 (SHA256SUMS.txt)
        run: |
          Get-FileHash dist-installer\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii dist-installer\SHA256SUMS.txt
          Get-Content dist-installer\SHA256SUMS.txt

      - name: Publicar GitHub Release y adjuntar binarios
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Darius AI ${{ steps.meta.outputs.tag }}
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-installer/DariusAI-Setup-*.exe
            dist-installer/DariusAI-*-windows-x64-portable.zip
            dist-installer/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
