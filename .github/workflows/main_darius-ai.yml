name: CI — Darius AI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # GATE 1: Calidad de Código y Análisis Estático (< 1 minuto)
  # =========================================================================
  quality:
    name: Linting y Estilo (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Ruff
        run: pip install ruff

      - name: Verificar linting con Ruff
        run: ruff check --output-format=github .

  # =========================================================================
  # GATE 2: Detección de Secretos (Gitleaks)
  # =========================================================================
  security-secrets:
    name: Escaneo de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout completo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # GATE 3: Matriz de Pruebas y Auditoría de Seguridad en Windows Nativo
  # =========================================================================
  test-windows:
    name: Windows Nativo (Python ${{ matrix.python-version }})
    needs: [quality, security-secrets]
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Auditoría de vulnerabilidades en dependencias (pip-audit)
        run: pip-audit --desc on -r requirements.txt

      - name: Ejecutar pruebas unitarias con cobertura
        run: >
          python -m pytest tests/ -v
          --junitxml=test-results-${{ matrix.python-version }}.xml
          --cov=.
          --cov-report=term-missing
          -m "not live"

      - name: Subir artefacto con resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
