name: CI — Darius AI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # =========================================================================
  # GATE 1: Calidad de Código y Análisis Estático (< 1 minuto)
  # =========================================================================
  quality:
    name: Linting y Tipado (Ruff + Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar herramientas de análisis estático
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install numpy beautifulsoup4 requests httpx psutil

      - name: Verificar linting con Ruff
        run: ruff check --output-format=github .

      - name: Verificar formato con Ruff
        run: ruff format --check .

      - name: Verificar tipado estático con Mypy
        run: mypy src/

  # =========================================================================
  # GATE 2: Detección de Secretos (Gitleaks)
  # =========================================================================
  security-secrets:
    name: Escaneo de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout completo del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # GATE 3: Matriz de Pruebas y Auditoría de Seguridad en Windows Nativo
  # =========================================================================
  test-windows:
    name: Windows Nativo (Python ${{ matrix.python-version }})
    needs: [quality, security-secrets]
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Auditoría de vulnerabilidades en dependencias (pip-audit)
        run: pip-audit --desc on -r requirements.txt

      - name: Ejecutar pruebas unitarias con cobertura
        run: >
          python -m pytest tests/ -v
          --junitxml=test-results-${{ matrix.python-version }}.xml
          --cov=src
          --cov-report=term-missing
          --cov-report=xml:coverage-${{ matrix.python-version }}.xml
          -m "not live"

      - name: Subir artefacto con resultados de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            test-results-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
