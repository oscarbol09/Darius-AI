# Gitleaks Configuration for Darius AI
title = "Darius AI Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Permitir plantilla .env.example, tokens sinteticos de test y commits historicos auditados"
paths = [
  '''\.env\.example'''
]
regexes = [
  '''sk-test[\w-]*''',
  '''gsk[_-](?:test|valid|invalid)[\w-]*''',
  '''AIzaSyA{20,}''',
  '''api03-1234567890abcdef1234''',
  '''v1-1234567890abcdef123456''',
  '''1234567890abcdef1234567890abcdef''',
  '''MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC3'''
]
commits = [
  "324a6b2d925f3ad6af0c695cca10512e3bc89b3d",
  "cd4f8994b983d8a08f4ef350411258c1ad8a0361"
]
